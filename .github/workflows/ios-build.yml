name: iOS source build check

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned upstream modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain information
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          git submodule status
      - name: Build Nexa iOS Simulator without signing
        run: |
          xcodebuild \
            -project Nexa.xcodeproj \
            -scheme Nexa \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
