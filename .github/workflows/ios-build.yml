name: iOS source build check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: nexa-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout pinned upstream sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Audit project membership, licenses and upstream source pins
        run: python3 Scripts/check_integration.py
      - name: Compile and test Nexa journaled backup/restore on a disposable host root
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          swiftc -D NEXA_LOCAL_TEST \
            Nexa/Sources/AppPaths.swift \
            Vendor/WCMigrate/BackupProgress.swift \
            Nexa/Sources/BackupManager.swift \
            Nexa/Sources/NexaBackupRestore.swift \
            Tests/BackupRestoreHostTests.swift \
            -o "$scratch/nexa-restore-tests"
          NEXA_TEST_ROOT="$scratch/TestRoot" "$scratch/nexa-restore-tests"
      - name: Test upstream WCMigrate LoginInfo2 parser with synthetic fixtures
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          swiftc \
            Vendor/WCMigrate/WeChatIdentityResolver.swift \
            Tests/WeChatIdentityHostTests.swift \
            -o "$scratch/identity-tests"
          NEXA_TEST_ROOT="$scratch/Fixture" "$scratch/identity-tests"
      - name: Targeted upstream WQFiles core, archive and access safety regressions
        timeout-minutes: 12
        run: bash Scripts/test_wqfiles_integrated.sh

  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned upstream modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain information
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          git submodule status
      - name: Build Nexa iOS Simulator without signing
        run: |
          xcodebuild \
            -project Nexa.xcodeproj \
            -scheme Nexa \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  watch-build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check watchOS SDK and translated Watch strings
        run: |
          xcodebuild -version
          xcrun --sdk watchsimulator --show-sdk-version
          plutil -lint NexaWatch/Localization/zh-Hans.lproj/Localizable.strings
          plutil -lint NexaWatch/Localization/en.lproj/Localizable.strings
      - name: Build NexaWatch simulator app without signing
        run: |
          xcodebuild \
            -project Nexa.xcodeproj \
            -target NexaWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
