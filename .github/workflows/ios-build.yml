name: iOS source build check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: nexa-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned upstream modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Toolchain information
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          git submodule status
      - name: Build Nexa iOS Simulator without signing
        run: |
          xcodebuild \
            -project Nexa.xcodeproj \
            -scheme Nexa \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  watch-build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check watchOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk watchsimulator --show-sdk-version
      - name: Build NexaWatch simulator app without signing
        run: |
          xcodebuild \
            -project Nexa.xcodeproj \
            -target NexaWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
